name: Verificar e publicar prévia

# A cada envio: roda os testes e a checagem de tipos.
# Na branch principal e na branch de desenvolvimento: publica a prévia no GitHub Pages
# (branch gh-pages), em https://<usuario>.github.io/<repositorio>/
on:
  push:
    branches:
      - main
      - claude/trusting-carson-fakp6a
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  publicar:
    name: Publicar prévia
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Montar a prévia (painel + app)
        run: npm run previa
        env:
          BASE: /${{ github.event.repository.name }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          # Chave do Pop AI (opcional): Settings → Secrets and variables → Actions → GEMINI_API_KEY.
          # Atenção: na prévia pública, qualquer pessoa consegue ver a chave no código da página.
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Enviar para a branch gh-pages
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prévia de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Endereço
        run: |
          dono="${GITHUB_REPOSITORY_OWNER,,}"
          echo "Prévia: https://${dono}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
